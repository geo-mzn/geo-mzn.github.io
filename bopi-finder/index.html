<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BopiFinder!</title>

    <link rel="icon" type="image/png"
        href="https://cdn.bopimo.com/static/images/favicon.png">
    <h1>BopiFinder</h1>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            padding: 40px;
        }

        input {
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }

        .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.info {
    flex: 1;
}

        img {
            border-radius: 50%;
        }

        a {
            color: #4da6ff;
        }
        
        .bopi {
    margin-left: auto;
}
    </style>
</head>
<body>

    <p>Find Bopi's through UserID or Username!</p>
    <p id="splash"></p>

    <input
        type="text"
        id="textbox"
        placeholder="Enter Username or ID">

    <button id="search">Search</button>

    <div id="result"></div>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <div id="creds-stuff"></div>
    <script>
        const version = "1.0.0"
        const result = document.getElementById("result");

        document.getElementById("search").addEventListener("click", async () => {
            const input = document
                .getElementById("textbox")
                .value
                .trim();

            if (!input) return;

            result.innerHTML = "Loading...";

            try {
                let user;

                if (/^\d+$/.test(input)) {
                    const res = await fetch(
    "https://corsproxy.io/?" +
    encodeURIComponent(
        `https://www.bopimo.com/api/user/${input}`
    )
);

                    user = await res.json();
                } else {
                    const res = await fetch(
    "https://corsproxy.io/?" +
    encodeURIComponent(
        `https://www.bopimo.com/api/users?search=${input}`
    )
);

                    const json = await res.json();

                    if (!json.data.length) {
                        result.innerHTML = "<h2>User not found.</h2>";
                        return;
                    }

                    user = json.data[0];

                    if (user.username === "BopiFinder") {
                        user.username = "BopiFinder (OFFICIAL)"
                    }
                    else if (user.username === "GeoMzn") {
                        user.username = "GeoMzn (BOPIMO CREATOR)"
                    }
                }

result.innerHTML = `
    <div class="card">

        <div class="info">
            <h2>${user.username}</h2>

            <p><b>ID:</b> ${user.id}</p>
            <p><b>Level:</b> ${user.level}</p>
            <p><b>XP:</b> ${user.xp}</p>
            <p><b>Status:</b> ${user.online ? "🟢 Online" : "🔴 Offline"}</p>

            <p>
                <a href="${user.url}" target="_blank">View Profile</a>
            </p>
        </div>

        <img src="${user.bopi?.headshot_url}" width="128">
        <img src="${user.bopi_url}" class="bopi" width="128">

    </div>
`;
            }
            catch (err) {
                result.innerHTML =
                    "<h2>Failed to fetch user.</h2>";
                console.error(err);
            }
        });
      const splashes = [
    `omg its bopifinder v${version}!`,
    "look its a bird",
    "'create on midnight ONLY' 😭🙏🥀",
    "BopiFinder by Geo_mzn, Bopimo! by Isaiah, FireCat, and Leon"
];

const splashGen = Math.floor(Math.random() * splashes.length);

document.getElementById("splash").textContent =
    splashes[splashGen];
    </script>

</body>
</html>
