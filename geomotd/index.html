<!DOCTYPE html>
<html>
<head>
  <title>geo meme</title>

  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial;
      padding-top: 30px;
    }

    h1 {
      font-size: 40px;
    }

    #dateLabel {
      color: #aaa;
      font-size: 18px;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    img {
      max-width: 90%;
      border-radius: 15px;
      box-shadow: 0px 0px 20px black;
    }
  </style>
</head>

<body>

  <h1>geo meeme</h1>

  <h3 id="dateLabel"></h3>

  <img id="meme">

  <script>

    // meme image list
    const memes = [
      "imgLib/images.jpeg"
    ];

    // get today's date
    const today = new Date();

    // format the date nicely
    const formattedDate =
      today.toLocaleDateString("en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });

    // show date label
    document.getElementById("dateLabel").innerText =
      "geyo meame 4 " + formattedDate;

    // generate daily seed
    const seed =
      today.getFullYear() * 1000 +
      today.getMonth() * 100 +
      today.getDate();

    // choose meme
    const index = seed % memes.length;

    // display meme
    document.getElementById("meme").src = memes[index];

  </script>

</body>
</html>
