<!DOCTYPE html>
<html>
<head>
  <style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  text-align: center;
  padding: 20px;
}

/* Main container */
.container {
  max-width: 600px;
  margin: auto;
  background: #111827;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.35);
}

/* Headings */
h1 {
  font-size: 28px;
  margin-bottom: 10px;
}

p {
  font-size: 16px;
  line-height: 1.6;
  color: #cbd5e1;
}

/* Buttons & links */
button, a {
  display: block;
  width: 100%;
  max-width: 280px;
  margin: 15px auto 0;
  padding: 14px;
  background: #2563eb;
  color: white;
  text-decoration: none;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.2s ease;
}

button:hover, a:hover {
  background: #1d4ed8;
}

/* Small screens (phones) */
@media (max-width: 480px) {
  body {
    padding: 12px;
  }

  .container {
    padding: 18px;
    border-radius: 12px;
  }

  h1 {
    font-size: 22px;
  }

  p {
    font-size: 14px;
  }

  button, a {
    font-size: 15px;
    padding: 12px;
    max-width: 100%;
  }
}

/* Very small phones */
@media (max-width: 320px) {
  h1 {
    font-size: 20px;
  }

  p {
    font-size: 13px;
  }
}
  </style>
  <meta charset="UTF-8">
  <title>SMG4 x FNF Downloads</title>
  <h1 id="header">SMG4 x FNF Downloads</h1>
</head>
<body>
  
  <script>
function downloadWindows() {
  window.location.href = "windows.zip";
}
    function downloadMobile() {
      window.location.href = "mobile.zip"
    }
</script>

  <button onclick="downloadWindows()">Download for Windows (x64)</button>
  <button onclick="downloadMobile()">Download for PsychEngine Mobile</button>

</body>
</html>
