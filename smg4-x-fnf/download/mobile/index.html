<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Downloading SMG4 x FNF</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: #111827;
      padding: 25px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Download Starting...</h1>

  <p>
    If it doesn’t start automatically:<br>
    click the button below.
  </p>

  <a href="mobile.zip">Manual Download</a>
</div>

<script>
  // auto download after short delay
  setTimeout(() => {
    window.location.href = "mobile.zip";
  }, 1500);
</script>

</body>
</html>
